{% extends "base.html" %}
{% block title %}시험모드 - ERP CBT문제{% endblock %}
{% block content %}
  <h1>📝 시험모드</h1>
  <p class="sub">회차 하나를 골라 이론 문제 전체를 실제 시험처럼 풀어봅니다. 정답은 문제마다 바로 안 보여주고, 다 풀고 제출하면 한번에 채점됩니다.</p>

  <form method="post" action="{{ url_for('exam_start') }}" class="card">
    <label>이름 (오답노트 구분용)</label>
    <input type="text" name="name" value="{{ name }}" required placeholder="예: 홍길동">

    <label>과목/급수</label>
    <select name="subject_level">
      {% for sl in subject_levels %}
        <option value="{{ sl.value }}">{{ sl.label }}</option>
      {% endfor %}
    </select>

    <label>범위</label>
    <select name="scope">
      {% for s in scopes %}
        <option value="{{ s.value }}" {% if s.is_year %}style="font-weight:700;"{% endif %}>{{ s.label }}</option>
      {% endfor %}
    </select>

    <button type="submit">시험 시작</button>
  </form>

  <a class="btn btn-secondary" href="{{ url_for('setup') }}">← 일반 연습으로 돌아가기</a>
{% endblock %}
